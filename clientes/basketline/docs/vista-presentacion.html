<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Basketline · Demo</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(70% 60% at 50% 30%, #2a2416, #0b0b0c 70%); font-family: system-ui, sans-serif; color: #f2f2f2; display: flex; flex-direction: column; align-items: center; }
  header { padding: 18px 0 8px; letter-spacing: .35em; font-size: 13px; color: #c9a24d; }
  main { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; gap: 48px; padding: 12px 32px 32px; }
  .pc { width: min(64vw, 1100px); }
  .pantalla { position: relative; aspect-ratio: 16 / 10; border: 12px solid #1b1b1d; border-radius: 14px; overflow: hidden; background: #000; box-shadow: 0 30px 80px rgba(0,0,0,.6); }
  .pantalla iframe { position: absolute; top: 0; left: 0; width: 1440px; height: 900px; border: 0; transform-origin: 0 0; }
  .pie { width: 30%; height: 18px; margin: 0 auto; background: linear-gradient(#1b1b1d, #111); border-radius: 0 0 10px 10px; }
  .cel { position: relative; width: 300px; height: 620px; border: 10px solid #1b1b1d; border-radius: 44px; overflow: hidden; background: #000; box-shadow: 0 30px 80px rgba(0,0,0,.6); flex-shrink: 0; }
  .cel iframe { position: absolute; top: 0; left: 0; width: 390px; height: 780px; border: 0; transform: scale(.7180); transform-origin: 0 0; }
  .muesca { position: absolute; z-index: 2; top: 8px; left: 50%; width: 90px; height: 24px; margin-left: -45px; background: #000; border-radius: 14px; }
  p.et { text-align: center; font-size: 12px; color: #9a9a9a; margin: 12px 0 0; }
</style>
</head>
<body>
<header>BASKETLINE</header>
<main>
  <div class="pc">
    <div class="pantalla" id="pantalla"><iframe id="ipc" src="http://localhost:3000/" title="Vista computador"></iframe></div>
    <div class="pie"></div>
    <p class="et">Computador</p>
  </div>
  <div>
    <div class="cel"><div class="muesca"></div><iframe src="http://localhost:3000/" title="Vista celular"></iframe></div>
    <p class="et">Celular</p>
  </div>
</main>
<script>
  // Escala el iframe de 1440 px al ancho real de la pantalla dibujada
  const p = document.getElementById("pantalla"), f = document.getElementById("ipc");
  const ajustar = () => { const s = p.clientWidth / 1440; f.style.transform = `scale(${s})`; f.style.height = p.clientHeight / s + "px"; };
  new ResizeObserver(ajustar).observe(p);
</script>
</body>
</html>
